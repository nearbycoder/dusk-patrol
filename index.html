<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1626">
<title>Dusk Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ffe2bf;
    --peach: #ffc890;
    --rose: #e6a2a6;
    --dim: rgba(255, 232, 214, 0.58);
    --night: #1c1626;
    --plum: #5c2b4e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--night);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
  #view {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: none;
  }
  .pix { font-family: 'Silkscreen', 'Courier New', monospace; font-weight: 700; }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(ellipse at 50% 120%, #4a2a46 0%, #2a1f36 45%, #1c1626 100%);
    transition: opacity 0.9s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .logo {
    font-size: clamp(34px, 8.4vw, 92px); line-height: 0.9; letter-spacing: 0.03em; color: #ffd7a2;
    text-shadow: 0.06em 0.06em 0 #a8454f, 0.12em 0.12em 0 #4a2142;
    text-align: center; white-space: nowrap;
  }
  .sub {
    font-size: clamp(10px, 1.3vw, 13px); letter-spacing: 0.42em; text-transform: uppercase;
    color: #e9b9bd; text-align: center; padding-left: 0.42em;
  }
  #bar {
    width: min(340px, 72vw); height: 14px; padding: 3px; background: #1c1626;
    box-shadow: 0 0 0 2px #ffd7a2, 0 0 0 4px #1c1626, 4px 4px 0 4px #4a2142;
  }
  #bar i { display: block; height: 100%; width: 0%; background: repeating-linear-gradient(90deg, #ffb070 0 6px, #ff9a5c 6px 8px); transition: width 0.15s linear; }
  #status { font-size: 11px; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase; min-height: 1em; }
  #fail { display: none; max-width: 520px; text-align: center; font-size: 13px; line-height: 1.6; color: #ffd7c8; padding: 0 20px; }

  /* ---------- title card ---------- */
  #titlecard {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; padding-bottom: 8vh;
  }
  #titlecard.on { opacity: 1; }
  #titlecard .logo { text-shadow: 0.06em 0.06em 0 #a8454f, 0.12em 0.12em 0 rgba(40, 18, 46, 0.8); }
  #titlecard .sub { color: #ffe6d6; text-shadow: 2px 2px 0 rgba(40, 18, 46, 0.75); }
  #prompt {
    margin-top: 10px; font-size: 12px; letter-spacing: 0.2em; color: #fff2e2; text-transform: uppercase;
    padding: 7px 14px; background: rgba(28, 18, 38, 0.45); box-shadow: 0 0 0 1px rgba(255, 215, 170, 0.35);
    animation: blink 1.6s steps(2, jump-none) infinite;
  }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.35; } }

  /* ---------- quiet hint strip ---------- */
  #strip {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 16px; padding: 6px 12px 6px 14px; white-space: nowrap;
    font-size: 11px; letter-spacing: 0.08em; color: var(--dim);
    background: rgba(24, 16, 34, 0.38); box-shadow: 0 0 0 1px rgba(255, 220, 190, 0.10);
    opacity: 0; transition: opacity 1s ease; pointer-events: none;
  }
  #strip.on { opacity: 1; }
  #strip b { color: #ffe6cc; font-weight: 600; }
  #strip .sep { color: rgba(255, 220, 190, 0.28); }
  #msl { display: flex; gap: 4px; align-items: center; margin-left: 2px; }
  #msl i {
    position: relative; display: block; width: 6px; height: 13px; background: rgba(255, 210, 170, 0.12);
    box-shadow: inset 0 0 0 1px rgba(255, 210, 170, 0.45);
  }
  #msl i u { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: #ffc58e; }
  #msl i.reload u { background: rgba(255, 170, 120, 0.55); }
  #view-name {
    position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 12; pointer-events: none;
    font-size: 11px; letter-spacing: 0.4em; color: #fff0de; opacity: 0; transition: opacity 0.5s ease;
    text-shadow: 1px 1px 0 rgba(30, 16, 40, 0.8); padding-left: 0.4em;
  }
  #view-name.on { opacity: 0.9; }
  #sound {
    position: fixed; top: 10px; right: 12px; z-index: 13; cursor: pointer;
    font: 600 11px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.12em; color: var(--dim);
    background: rgba(24, 16, 34, 0.38); border: 0; padding: 7px 10px;
    box-shadow: 0 0 0 1px rgba(255, 220, 190, 0.14); opacity: 0; transition: opacity 1s ease, color .2s;
  }
  #sound.on { opacity: 1; }
  #sound:hover { color: #fff0e0; }
  #sound .dot { display: inline-block; width: 7px; height: 7px; margin-right: 7px; background: rgba(255, 210, 170, 0.25); vertical-align: 0px; }
  #sound.live .dot { background: #8dff9a; }

  /* ---------- touch controls ---------- */
  #touch { display: none; }
  body.attract #loader, body.attract #strip, body.attract #sound, body.attract #titlecard,
  body.attract #view-name, body.attract #touch { display: none !important; }
  body.attract #view { cursor: default; }
  body.touch #touch { display: block; }
  body.touch #strip .k-mouse { display: none; }
  .tbtn {
    position: fixed; z-index: 14; width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 600 11px/1 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: #fff0e0;
    background: rgba(28, 18, 40, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 210, 170, 0.55);
    touch-action: none;
  }
  .tbtn.down { background: rgba(255, 170, 110, 0.45); }
  #t-fire { right: 22px; bottom: calc(26px + var(--lift, 0px)); width: 86px; height: 86px; }
  #t-boost { right: 122px; bottom: calc(22px + var(--lift, 0px)); }
  #t-roll { right: 34px; bottom: calc(126px + var(--lift, 0px)); }
  #t-view { left: 18px; top: 52px; width: 58px; height: 58px; font-size: 10px; }
  @media (max-width: 980px) { #strip { font-size: 10px; gap: 9px; padding: 5px 9px 5px 11px; } }
  @media (max-width: 820px) { #strip .opt, #strip .sep { display: none; } }
  @media (max-width: 640px) { #strip .k-mouse { display: none; } #view-name { top: 40px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="loader">
  <div class="logo pix">DUSK PATROL</div>
  <div class="sub">lake country &middot; last light</div>
  <div id="bar"><i></i></div>
  <div id="status">waking the workers</div>
  <div id="fail"></div>
</div>

<div id="titlecard">
  <div class="logo pix">DUSK PATROL</div>
  <div class="sub">lake country &middot; last light</div>
  <div id="prompt">move the mouse to take the stick</div>
</div>

<div id="strip">
  <span class="k-mouse"><b>MOUSE</b> steer</span><span class="sep k-mouse">/</span>
  <span class="k-mouse"><b>CLICK</b> roll</span><span class="sep k-mouse">/</span>
  <span class="k-mouse"><b>HOLD</b> boost</span><span class="sep k-mouse">/</span>
  <span class="k-mouse opt"><b>RIGHT</b> or <b>F</b> missile</span><span class="sep k-mouse opt">/</span>
  <span class="k-mouse"><b>SPACE</b> view</span>
  <span id="msl"><i><u></u></i><i><u></u></i><i><u></u></i><i><u></u></i></span>
</div>
<div id="view-name">CHASE</div>
<button id="sound" type="button" aria-pressed="false"><span class="dot"></span><span id="sound-label">SOUND OFF</span></button>

<div id="touch">
  <div class="tbtn" id="t-fire">FIRE</div>
  <div class="tbtn" id="t-boost">BOOST</div>
  <div class="tbtn" id="t-roll">ROLL</div>
  <div class="tbtn" id="t-view">VIEW</div>
</div>

<script type="text/plain" id="gen-src">
'use strict';
// ===================== DUSK PATROL world generator =====================
// Runs inside web workers (and in node for previews). Everything tiles.
var T = new Float64Array(3);
var GX = new Float64Array(256), GY = new Float64Array(256);
for (var gi = 0; gi < 256; gi++) { var ga = gi * 2.39996323 + 0.7; GX[gi] = Math.cos(ga); GY[gi] = Math.sin(ga); }

function hash3(x, y, s) {
  var h = (Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(s + 0x3c6ef372, 0x9e3779b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
// periodic gradient noise with analytic derivatives (period P lattice cells), result in T[0..2]
function noised(x, y, P, s) {
  var xf = Math.floor(x), yf = Math.floor(y), fx = x - xf, fy = y - yf;
  var ix = xf % P; if (ix < 0) ix += P;
  var iy = yf % P; if (iy < 0) iy += P;
  var ix1 = ix + 1 === P ? 0 : ix + 1, iy1 = iy + 1 === P ? 0 : iy + 1;
  var a = hash3(ix, iy, s) & 255, b = hash3(ix1, iy, s) & 255, c = hash3(ix, iy1, s) & 255, d = hash3(ix1, iy1, s) & 255;
  var v00 = GX[a] * fx + GY[a] * fy, v10 = GX[b] * (fx - 1) + GY[b] * fy;
  var v01 = GX[c] * fx + GY[c] * (fy - 1), v11 = GX[d] * (fx - 1) + GY[d] * (fy - 1);
  var ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  var dux = 30 * fx * fx * (fx * (fx - 2) + 1), duy = 30 * fy * fy * (fy * (fy - 2) + 1);
  var k1 = v10 - v00, k2 = v01 - v00, k3 = v00 - v10 - v01 + v11;
  T[0] = v00 + k1 * ux + k2 * uy + k3 * ux * uy;
  T[1] = GX[a] + (GX[b] - GX[a]) * ux + (GX[c] - GX[a]) * uy + (GX[a] - GX[b] - GX[c] + GX[d]) * ux * uy + dux * (k1 + k3 * uy);
  T[2] = GY[a] + (GY[b] - GY[a]) * ux + (GY[c] - GY[a]) * uy + (GY[a] - GY[b] - GY[c] + GY[d]) * ux * uy + duy * (k2 + k3 * ux);
  return T[0];
}
function fbm(u, v, F, oct, s) {
  var sum = 0, amp = 1, f = F, norm = 0;
  for (var o = 0; o < oct; o++) { sum += amp * noised(u * f, v * f, f, s + o * 101); norm += amp; amp *= 0.5; f *= 2; }
  return sum / norm;
}
function sstep(a, b, x) { var t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

// ---------- terrain: one sample. u,v in [0,1) tile space. writes biome noise to BN ----------
var BN = new Float64Array(4);
function terrainSample(u, v, seed) {
  // large domain warp for organic lake shapes
  var wx = fbm(u, v, 3, 4, seed + 11), wy = fbm(u, v, 3, 4, seed + 23);
  var uu = u + 0.075 * wx, vv = v + 0.075 * wy;
  // fine warp
  var ex = fbm(uu, vv, 12, 3, seed + 31), ey = fbm(uu, vv, 12, 3, seed + 41);
  var pu = uu + 0.012 * ex, pv = vv + 0.012 * ey;
  // lake / upland field
  var L = fbm(pu, pv, 5, 5, seed + 37);
  // erosion-style rolling hills
  var a = 0, b = 1, dx = 0, dy = 0, f = 14;
  for (var o = 0; o < 7; o++) {
    noised(pu * f, pv * f, f, seed + 53 + o * 7);
    dx += T[1]; dy += T[2];
    a += b * T[0] / (1 + 0.6 * (dx * dx + dy * dy));
    b *= 0.5; f *= 2;
  }
  // mountain ranges
  var Mraw = fbm(u + 0.03 * wy, v + 0.03 * wx, 2, 3, seed + 71);
  var M = sstep(0.02, 0.26, Mraw);
  var R = 0;
  if (M > 0) {
    var amp = 1, f2 = 7, w = 1, norm = 0;
    for (var o2 = 0; o2 < 6; o2++) {
      var n = noised(pu * f2, pv * f2, f2, seed + 89 + o2 * 13);
      var r = 1 - Math.abs(n) * 1.7; r = r < 0 ? 0 : r; r = r * r;
      R += r * amp * w; norm += amp;
      w = clamp(r * 1.4, 0, 1);
      amp *= 0.5; f2 *= 2;
    }
    R /= norm;
  }
  var low = sstep(-0.02, 0.22, L);
  var h = L * 500 + a * (30 + 80 * low) + R * M * 1250 + M * 60 - 4;
  // shoreline shaping: wide shallow shelves, gentle beaches
  if (h < 0) {
    var d = -h;
    d = d < 7 ? d * 0.38 : 2.66 + (d - 7) * 0.7;
    h = -Math.min(d, 75);
  } else if (h < 14) {
    h = h * (0.3 + 0.05 * h);
  }
  // biome noises
  BN[0] = fbm(u, v, 40, 4, seed + 101);              // forest patches
  BN[1] = fbm(u + 0.02 * wx, v, 22, 3, seed + 131);  // autumn hue patches
  BN[2] = fbm(u, v, 56, 3, seed + 151);              // conifer stands
  BN[3] = fbm(u, v, 90, 2, seed + 171);              // meadow tint
  return h;
}

function genRows(N, r0, r1, seed, onProgress) {
  var rows = r1 - r0;
  var H = new Float32Array(rows * N), B = new Uint8Array(rows * N * 4);
  for (var j = r0; j < r1; j++) {
    var v = j / N;
    for (var i = 0; i < N; i++) {
      var h = terrainSample(i / N, v, seed);
      var k = (j - r0) * N + i;
      H[k] = h;
      B[k * 4] = clamp(Math.round(128 + BN[0] * 300), 0, 255);
      B[k * 4 + 1] = clamp(Math.round(128 + BN[1] * 380), 0, 255);
      B[k * 4 + 2] = clamp(Math.round(128 + BN[2] * 380), 0, 255);
      B[k * 4 + 3] = clamp(Math.round(128 + BN[3] * 380), 0, 255);
    }
    if (onProgress && ((j - r0) & 7) === 7) onProgress(j - r0 + 1);
  }
  return { H: H, B: B };
}

// shadow height sweep: S >= h everywhere; a point at height y is in shadow if y < S
function shadowSweep(N, h, cell, sx, sz, tanEl) {
  var S = new Float32Array(h);
  var ax = Math.abs(sx), az = Math.abs(sz);
  var alongX = ax >= az;
  var main = alongX ? sx : sz, side = alongX ? sz : sx;
  var dir = main < 0 ? -1 : 1;          // step toward the sun along main axis
  var ds = side / Math.abs(main);       // fractional side step toward the sun
  var drop = tanEl * Math.sqrt(1 + ds * ds) * cell;
  for (var lap = 0; lap < 2; lap++) {
    for (var k = 0; k < N; k++) {
      var m = dir < 0 ? k : N - 1 - k;           // process away from the sun
      var mu = (m + dir + N) % N;                // upstream line (toward the sun)
      for (var s = 0; s < N; s++) {
        var sf = s + ds, s0 = Math.floor(sf), fs = sf - s0;
        var sa = ((s0 % N) + N) % N, sb = (sa + 1) % N;
        var ia, ib, ic;
        if (alongX) { ia = sa * N + mu; ib = sb * N + mu; ic = s * N + m; }
        else { ia = mu * N + sa; ib = mu * N + sb; ic = m * N + s; }
        var up = S[ia] + (S[ib] - S[ia]) * fs - drop;
        if (up > S[ic]) S[ic] = up;
      }
    }
  }
  return S;
}

function boxBlur(N, src, r) {
  var tmp = new Float32Array(N * N), out = new Float32Array(N * N), inv = 1 / (2 * r + 1);
  for (var j = 0; j < N; j++) {
    var acc = 0, row = j * N;
    for (var i = -r; i <= r; i++) acc += src[row + ((i + N) % N)];
    for (var i2 = 0; i2 < N; i2++) {
      tmp[row + i2] = acc * inv;
      acc += src[row + ((i2 + r + 1) % N)] - src[row + ((i2 - r + N) % N)];
    }
  }
  for (var i3 = 0; i3 < N; i3++) {
    var acc2 = 0;
    for (var j2 = -r; j2 <= r; j2++) acc2 += tmp[((j2 + N) % N) * N + i3];
    for (var j3 = 0; j3 < N; j3++) {
      out[j3 * N + i3] = acc2 * inv;
      acc2 += tmp[((j3 + r + 1) % N) * N + i3] - tmp[((j3 - r + N) % N) * N + i3];
    }
  }
  return out;
}

// max mip pyramid of cell maxima (cell (i,j) spans samples i..i+1, j..j+1)
function maxMips(N, h) {
  var levels = [], m0 = new Float32Array(N * N);
  for (var j = 0; j < N; j++) {
    var j1 = (j + 1) % N;
    for (var i = 0; i < N; i++) {
      var i1 = (i + 1) % N;
      m0[j * N + i] = Math.max(h[j * N + i], h[j * N + i1], h[j1 * N + i], h[j1 * N + i1]);
    }
  }
  levels.push(m0);
  var n = N, prev = m0;
  while (n > 1) {
    var n2 = n >> 1, m = new Float32Array(n2 * n2);
    for (var y = 0; y < n2; y++) for (var x = 0; x < n2; x++) {
      var a = prev[(2 * y) * n + 2 * x], b = prev[(2 * y) * n + 2 * x + 1], c = prev[(2 * y + 1) * n + 2 * x], d = prev[(2 * y + 1) * n + 2 * x + 1];
      m[y * n2 + x] = Math.max(a, b, c, d);
    }
    levels.push(m); prev = m; n = n2;
  }
  return levels;
}

// finish pass: forest density + canopy, shadows, AO, max mips
function finishTerrain(N, cell, H, B, sun) {
  var hc = new Float32Array(N * N);
  var biome = new Uint8Array(N * N * 4);
  var maxH = -1e9, minH = 1e9;
  for (var j = 0; j < N; j++) {
    var jm = ((j - 1 + N) % N) * N, jp = ((j + 1) % N) * N, row = j * N;
    for (var i = 0; i < N; i++) {
      var im = (i - 1 + N) % N, ip = (i + 1) % N, k = row + i;
      var h = H[k];
      var gx = (H[row + ip] - H[row + im]) / (2 * cell), gz = (H[jp + i] - H[jm + i]) / (2 * cell);
      var slope = Math.sqrt(gx * gx + gz * gz);
      var fn = (B[k * 4] - 128) / 300;
      var hue = B[k * 4 + 1], con = (B[k * 4 + 2] - 128) / 380;
      // forest: patches, not on beaches/steep rock/high ground
      var f = sstep(-0.06, 0.05, fn) * sstep(1.5, 5.0, h) * sstep(0.95, 0.55, slope) * sstep(760, 520, h);
      // conifers favour high ground and their own stands
      var cf = clamp(sstep(-0.02, 0.2, con) * 0.8 + sstep(300, 650, h) * 0.6 + 0.08, 0, 1);
      var canopy = f * 11;
      hc[k] = h + canopy;
      biome[k * 4] = Math.round(f * 255);
      biome[k * 4 + 1] = hue;
      biome[k * 4 + 2] = Math.round(cf * 255);
      if (hc[k] > maxH) maxH = hc[k];
      if (hc[k] < minH) minH = hc[k];
    }
  }
  var S = shadowSweep(N, hc, cell, sun[0], sun[1], sun[2]);
  var bl = boxBlur(N, hc, 5);
  var bl2 = boxBlur(N, hc, 18);
  for (var q = 0; q < N * N; q++) {
    var ao = 0.62 + (hc[q] - bl[q]) / 26 + (hc[q] - bl2[q]) / 120;
    biome[q * 4 + 3] = Math.round(clamp(ao, 0, 1) * 255);
  }
  var hs = new Float32Array(N * N * 2);
  for (var p = 0; p < N * N; p++) { hs[p * 2] = hc[p]; hs[p * 2 + 1] = S[p]; }
  var mips = maxMips(N, hc);
  return { hs: hs, biome: biome, mips: mips, maxH: maxH, minH: minH, hc: hc, ground: H };
}

// ---------- clouds: cumulus heightfield (top offset above the cloud base) ----------
function rng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function genClouds(NC, cell, seed, sun) {
  var A = new Float32Array(NC * NC);
  var R = rng(seed);
  function blob(cx, cz, r, top) { // cx,cz,r in texels, top in m
    var r2 = r * r, x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r), z0 = Math.floor(cz - r), z1 = Math.ceil(cz + r);
    for (var z = z0; z <= z1; z++) {
      var dz = z - cz, zz = ((z % NC) + NC) % NC;
      for (var x = x0; x <= x1; x++) {
        var dx = x - cx, d2 = dx * dx + dz * dz;
        if (d2 >= r2) continue;
        var val = top * Math.sqrt(1 - d2 / r2);

    float disc = B * B - 4.0 * A * C;
    if (disc >= 0.0) {
      float sq = sqrt(disc);
      float q = -0.5 * (B + (B >= 0.0 ? sq : -sq));
      float r1 = q / A;
      float r2 = abs(q) > 1e-12 ? C / q : 1e9;
      float lo = min(r1, r2), hi = max(r1, r2);
      r = lo >= sa ? lo : (hi >= sa ? hi : -1.0);
    }
  }
  return (r >= sa && r <= sb) ? r : -1.0;
}

// hierarchical max-mip traversal of the tiling height field, exact bilinear patches at the leaves
float traceTerrain(vec3 ro, vec3 rd, float tMax, out float spent) {
  spent = 0.0;
  float t = 0.0;
  if (ro.y > uMaxH) {
    if (rd.y >= 0.0) return -1.0;
    t = (uMaxH - ro.y) / rd.y;
  }
  vec3 o = vec3(ro.x / CELL, ro.y, ro.z / CELL);
  vec3 d = vec3(rd.x / CELL, rd.y, rd.z / CELL);
  vec2 sg = vec2(d.x >= 0.0 ? 1.0 : 0.0, d.z >= 0.0 ? 1.0 : 0.0);
  vec2 nud = (sg * 2.0 - 1.0) * 2e-3;
  vec2 inv = vec2(abs(d.x) > 1e-12 ? 1.0 / d.x : 1e12, abs(d.z) > 1e-12 ? 1.0 / d.z : 1e12);
  int lev = 7;
  for (int i = 0; i < 200; i++) {
    if (t >= tMax) return -1.0;
    vec3 p = o + d * t;
    float cs = float(1 << lev);
    vec2 cell = floor((p.xz + nud) / cs);
    vec2 tb = ((cell + sg) * cs - o.xz) * inv;
    float te = min(min(tb.x, tb.y), tMax);
    ivec2 ci = ivec2(mod(cell, float(NTEX >> lev)));
    float hm = texelFetch(uMax, ci, lev).r;
    float ye = o.y + d.y * te;
    if (min(p.y, ye) > hm) {
      t = te;
      vec2 np = floor((o.xz + d.xz * t + nud) / (cs * 2.0));
      if (any(notEqual(np, floor(cell * 0.5)))) lev = min(lev + 1, NLEV);
      continue;
    }
    if (lev > 0) {
      if (d.y < 0.0 && p.y > hm) t = max(t, (hm - o.y) / d.y);
      lev--;
      continue;
    }
    ivec2 c1 = ivec2(mod(cell + 1.0, float(NTEX)));
    float h00 = texelFetch(uHS, ci, 0).r;
    float h10 = texelFetch(uHS, ivec2(c1.x, ci.y), 0).r;
    float h01 = texelFetch(uHS, ivec2(ci.x, c1.y), 0).r;
    float h11 = texelFetch(uHS, c1, 0).r;
    vec2 l0 = p.xz - cell, l1 = (o.xz + d.xz * te) - cell, dl = l1 - l0;
    float kb = h10 - h00, kc = h01 - h00, kd = h00 - h10 - h01 + h11;
    float H0 = h00 + kb * l0.x + kc * l0.y + kd * l0.x * l0.y;
    float H1 = kb * dl.x + kc * dl.y + kd * (l0.x * dl.y + l0.y * dl.x);
    float H2 = kd * dl.x * dl.y;
    float s = solveFirst(p.y - H0, (ye - p.y) - H1, -H2, 0.0, 1.0);
    if (s >= 0.0) return mix(t, te, s);
    t = te;
    lev = 1;
  }
  spent = 1.0;
  return t < tMax ? t : -1.0;
}

// cumulus layer: top = CB + A(x,z), base = CB - KB*A(x,z); same traversal on the cloud max-mips
float traceClouds(vec3 ro, vec3 rd, float tMax, out float hitY) {
  hitY = 0.0;
  float top = CB + uCMaxA, bot = CB - KB * uCMaxA;
  float t0 = 0.0, t1 = tMax;
  if (abs(rd.y) < 1e-6) {
    if (ro.y > top || ro.y < bot) return -1.0;
  } else {
    float ta = (bot - ro.y) / rd.y, tb = (top - ro.y) / rd.y;
    t0 = max(min(ta, tb), 0.0);
    t1 = min(max(ta, tb), tMax);
  }
  if (t0 >= t1) return -1.0;
  vec3 o = vec3((ro.x + uCloudOff.x) / CCELL, ro.y, (ro.z + uCloudOff.y) / CCELL);
  vec3 d = vec3(rd.x / CCELL, rd.y, rd.z / CCELL);
  vec2 sg = vec2(d.x >= 0.0 ? 1.0 : 0.0, d.z >= 0.0 ? 1.0 : 0.0);
  vec2 nud = (sg * 2.0 - 1.0) * 2e-3;
  vec2 inv = vec2(abs(d.x) > 1e-12 ? 1.0 / d.x : 1e12, abs(d.z) > 1e-12 ? 1.0 / d.z : 1e12);
  float t = t0;
  int lev = 5;
  for (int i = 0; i < 140; i++) {
    if (t >= t1) return -1.0;
    vec3 p = o + d * t;
    float cs = float(1 << lev);
    vec2 cell = floor((p.xz + nud) / cs);
    vec2 tb = ((cell + sg) * cs - o.xz) * inv;
    float te = min(min(tb.x, tb.y), t1);
    ivec2 ci = ivec2(mod(cell, float(NC >> lev)));
    float am = texelFetch(uCMax, ci, lev).r;
    float ye = o.y + d.y * te;
    float ylo = min(p.y, ye), yhi = max(p.y, ye);
    if (am < 0.4 || ylo > CB + am || yhi < CB - KB * am) {
      t = te;
      vec2 np = floor((o.xz + d.xz * t + nud) / (cs * 2.0));
      if (any(notEqual(np, floor(cell * 0.5)))) lev = min(lev + 1, NLEVC);
      continue;
    }
    if (lev > 0) { lev--; continue; }
    ivec2 c1 = ivec2(mod(cell + 1.0, float(NC)));
    float a00 = texelFetch(uCl, ci, 0).r;
    float a10 = texelFetch(uCl, ivec2(c1.x, ci.y), 0).r;
    float a01 = texelFetch(uCl, ivec2(ci.x, c1.y), 0).r;
    float a11 = texelFetch(uCl, c1, 0).r;
    vec2 l0 = p.xz - cell, l1 = (o.xz + d.xz * te) - cell, dl = l1 - l0;
    float kb = a10 - a00, kc = a01 - a00, kd = a00 - a10 - a01 + a11;
    float A0 = a00 + kb * l0.x + kc * l0.y + kd * l0.x * l0.y;
    float A1 = kb * dl.x + kc * dl.y + kd * (l0.x * dl.y + l0.y * dl.x);
    float A2 = kd * dl.x * dl.y;
    float dy = ye - p.y;
    bool su = p.y >= CB, eu = ye >= CB;
    float s = -1.0;
    float uC = p.y - CB - A0 + 0.3, uB = dy - A1, uA = -A2;
    float lC = CB - KB * A0 + 0.3 - p.y, lB = -KB * A1 - dy, lA = -KB * A2;
    if (su && eu) s = solveFirst(uC, uB, uA, 0.0, 1.0);
    else if (!su && !eu) s = solveFirst(lC, lB, lA, 0.0, 1.0);
    else {
      float sc = clamp((CB - p.y) / dy, 0.0, 1.0);
      if (su) { s = solveFirst(uC, uB, uA, 0.0, sc); if (s < 0.0) s = solveFirst(lC, lB, lA, sc, 1.0); }
      else { s = solveFirst(lC, lB, lA, 0.0, sc); if (s < 0.0) s = solveFirst(uC, uB, uA, sc, 1.0); }
    }
    if (s >= 0.0) {
      float th = mix(t, te, s);
      hitY = o.y + d.y * th;
      return th;
    }
    t = te;
    lev = 1;
  }
  return -1.0;
}

float cloudShadow(vec3 P) {
  if (P.y > CB - 5.0) return 0.0;
  vec3 q = P + uShDir * ((CB - P.y) / uShDir.y);
  float a = textureLod(uCl, ((q.xz + uCloudOff) / CCELL + 0.5) / float(NC), 0.0).r;
  return smoothstep(3.0, 12.0, a);
}
float jetShadow(vec3 P) {
  vec3 d = P - uJetW;
  if (dot(d, uShDir) > -1.5) return 0.0;
  vec2 q = vec2(dot(d, uJsR), dot(d, uJsU)) / uJsExt;
  if (abs(q.x) >= 1.0 || abs(q.y) >= 1.0) return 0.0;
  return texelFetch(uJetSh, ivec2((q * 0.5 + 0.5) * 128.0), 0).r;
}
vec4 decal(vec3 P) {
  if (uDecalWin.w < 0.5) return vec4(0.0);
  vec2 q = (P.xz - uDecalWin.xy) / uDecalWin.z;
  if (q.x <= 0.0 || q.y <= 0.0 || q.x >= 1.0 || q.y >= 1.0) return vec4(0.0);
  return textureLod(uDecal, q, 0.0);
}
float flashLight(vec3 P) {
  if (uFlash.w <= 0.0) return 0.0;
  float dd = length(P - uFlash.xyz);
  return uFlash.w * clamp(1.0 - dd / 190.0, 0.0, 1.0);
}

vec3 terrainColor(vec3 P, vec3 rd, float t, vec2 fc, float b) {
  float b2 = bayer(fc + vec2(2.0, 1.0));
  float b3 = bayer(fc + vec2(1.0, 3.0));
  vec2 Pw = mod(P.xz, TILE);
  vec2 uv = (P.xz / CELL + 0.5) / float(NTEX);
  vec2 hs = textureLod(uHS, uv, 0.0).rg;
  float e = 1.0 / float(NTEX);
  float hL = textureLod(uHS, uv - vec2(e, 0.0), 0.0).r, hR = textureLod(uHS, uv + vec2(e, 0.0), 0.0).r;
  float hD = textureLod(uHS, uv - vec2(0.0, e), 0.0).r, hU = textureLod(uHS, uv + vec2(0.0, e), 0.0).r;
  vec3 n = normalize(vec3(hL - hR, 2.0 * CELL, hD - hU));
  vec4 bio = textureLod(uBio, uv, 0.0);
  float forest = bio.r, hue = bio.g, conif = bio.b, ao = bio.a;
  float ground = hs.r - forest * 11.0;
  float slope = 1.0 - n.y;
  float fp = t * uPixAng;
  float nz = vnoiseP(Pw / 40.0, vec2(TILE / 40.0));
  float nz2 = vnoiseP(Pw / 6.4, vec2(TILE / 6.4));
  float dn = 1.0 - smoothstep(0.8, 3.5, fp);
  if (dn > 0.0) {
    vec2 q = Pw / 3.2;
    float e0 = vnoiseP(q, vec2(6400.0)), ex = vnoiseP(q + vec2(0.4, 0.0), vec2(6400.0)), ez = vnoiseP(q + vec2(0.0, 0.4), vec2(6400.0));
    vec2 g = vec2(ex - e0, ez - e0) / 0.4 + (vec2(nz2) - 0.5) * 0.4;
    n = normalize(n + vec3(-g.x, 0.0, -g.y) * 0.42 * dn);
  }

  float ndl = dot(n, uSun);
  float sh = clamp((hs.g - P.y - 0.6) / 7.0, 0.0, 1.0);
  float shade = max(max(sh, cloudShadow(P) * 0.9), jetShadow(P));
  float lit = clamp(ndl * 2.3 + 0.45, 0.0, 1.0);
  lit *= 1.0 - 0.74 * shade;
  lit *= 0.6 + 0.4 * ao;
  lit += 0.11 * (fract(ground / 21.0) - 0.5) * smoothstep(0.03, 0.16, slope);
  lit += flashLight(P) * 0.35;
  vec4 dc = decal(P);
  lit *= 1.0 - 0.85 * dc.g;

  float snowLine = 840.0 + (nz - 0.5) * 150.0;
  float snow = smoothstep(snowLine - 25.0, snowLine + 25.0, ground) * smoothstep(0.62, 0.36, slope);
  float rock = max(smoothstep(0.30, 0.40, slope + (nz2 - 0.5) * 0.12), smoothstep(650.0, 760.0, ground + (nz - 0.5) * 90.0) * (1.0 - forest));
  float sand = smoothstep(2.4, 1.5, ground + (nz2 - 0.5) * 0.9) * smoothstep(0.28, 0.14, slope);
  vec3 col;
  if (snow > b2) {
    col = ramp(R_SNOW, N_SNOW, lit * 1.05 + 0.05, b);
  } else if (rock > b2) {
    float strata = fract(ground / 13.0 + nz2 * 0.7);
    col = ramp(R_ROCK, N_ROCK, lit * 0.95 + (strata - 0.5) * 0.16, b);
  } else if (sand > b2) {
    col = ramp(R_SAND, N_SAND, ground < 0.8 ? lit * 0.72 : lit, b);
  } else if (smoothstep(0.08, 0.4, forest) > b2) {
    // canopy: jittered crowns (nearest of four candidates); cell size grows with distance
    float cs = 8.0 * exp2(clamp(floor(log2(fp / 2.4)), 0.0, 6.0));
    vec2 tp = Pw / cs;
    float per = TILE / cs;
    vec2 base = floor(tp - 0.5);
    float best = 9.0;
    vec2 bo = vec2(0.0), bid = vec2(0.0);
    for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) {
      vec2 c = base + vec2(float(i), float(j));
      vec2 cm = mod(c, per);
      vec2 h = hash22(cm);
      if (h.x < 0.07 && cs < 9.0) continue;
      vec2 ctr = c + 0.5 + (h - 0.5) * 0.74;
      float r = 0.42 + 0.22 * hash12(cm + 3.7);
      vec2 o = (tp - ctr) / r;
      float dd = length(o);
      if (dd < best) { best = dd; bo = o; bid = cm; }
    }
    vec2 hh = hash22(bid + 11.0);
    float hv = hue + (hh.y - 0.5) * 0.34;
    int sp = hv < 0.43 ? R_CRIM : (hv < 0.6 ? R_ORNG : R_GOLD);
    bool con = hh.x < conif * 0.7;
    float detail = 1.0 - smoothstep(1.1, 1.9, fp);
    if (detail > hash12(bid + 5.3)) {
      float dd = con ? (abs(bo.x) + abs(bo.y)) * 0.8 + best * 0.25 : best;
      if (dd < 1.0) {
        vec3 sn = vec3(bo.x, sqrt(max(1.0 - best * best, 0.0)) * 0.85, bo.y);
        float tl = clamp(dot(normalize(sn), uSun) * 1.5 + 0.36 + (hh.y - 0.5) * 0.12, 0.0, 1.0);
        tl = tl * (1.0 - 0.72 * shade) * (0.75 + 0.25 * ao) + flashLight(P) * 0.35;
        col = con ? ramp(R_CONI, N_CONI, tl, b) : (sp == R_CRIM ? ramp(R_CRIM, N_CRIM, tl, b) : (sp == R_ORNG ? ramp(R_ORNG, N_ORNG, tl, b) : ramp(R_GOLD, N_GOLD, tl, b)));
      } else {
        col = ramp(R_FLOOR, N_FLOOR, lit * 0.55, b);
      }
    } else {
      vec2 sxz = normalize(uSun.xz);
      float tl = lit * 0.84 + (hash12(bid + 7.0) - 0.5) * 0.2 + dot(bo, sxz) * 0.12 * clamp(1.0 - best, 0.0, 1.0);
      col = con ? ramp(R_CONI, N_CONI, tl, b) : (sp == R_CRIM ? ramp(R_CRIM, N_CRIM, tl, b) : (sp == R_ORNG ? ramp(R_ORNG, N_ORNG, tl, b) : ramp(R_GOLD, N_GOLD, tl, b)));
    }
  } else {
    col = ramp(R_MEAD, N_MEAD, lit + (nz2 - 0.5) * 0.14 + (nz - 0.5) * 0.1, b);
  }
  // scorch + embers
  if (dc.g > 0.02) {
    if (dc.g * 1.3 > b3) col = ramp(R_SCORCH, N_SCORCH, lit * 0.7 + (nz2 - 0.5) * 0.3, b);
    if (dc.b > 0.02) {
      vec2 ec = floor(Pw / 1.6);
      float eh = hash12(mod(ec, TILE / 1.6));
      float fl = fract(uTime * (0.7 + eh * 1.6) + eh * 7.0);
      if (eh > 1.0 - dc.b * 0.45 && fl < 0.6) col = pal(R_EMBER, int(clamp(dc.b * 3.0 + fl * 1.5 + eh, 0.0, 3.0)));
    }
  }
  if (dc.r > 0.05 && dc.r * (0.6 + 0.8 * nz2) > b3 + 0.2) col = ramp(R_SMOKEL, N_SMOKEL, 0.55 + lit * 0.4, b);
  float fl = flashLight(P);
  if (fl > 0.2 + b3 * 0.6) col = mix(col, pal(R_FLAME, 4), 0.55);
  return col;
}

vec3 waterColor(vec3 P, vec3 rd, float t, vec2 fc, float b) {
  float b2 = bayer(fc + vec2(2.0, 1.0));
  float b3 = bayer(fc + vec2(1.0, 3.0));
  vec2 Pw = mod(P.xz, TILE);
  vec2 uv = (P.xz / CELL + 0.5) / float(NTEX);
  vec2 hs = textureLod(uHS, uv, 0.0).rg;
  float d = max(-hs.r, 0.0);
  float fp = t * uPixAng;
  // gentle periodic swell (integer wave numbers over the tile)
  const float K = 6.2831853 / TILE;
  vec2 g = vec2(0.0);
  vec2 k1 = K * vec2(820.0, 560.0), k2 = K * vec2(-430.0, 910.0), k3 = K * vec2(1450.0, -380.0), k4 = K * vec2(260.0, 1720.0);
  g += k1 * 0.10 * cos(dot(k1, Pw) - uTime * 1.9);
  g += k2 * 0.08 * cos(dot(k2, Pw) - uTime * 2.3);
  g += k3 * 0.05 * cos(dot(k3, Pw) - uTime * 3.1);
  g += k4 * 0.04 * cos(dot(k4, Pw) - uTime * 3.6);
  vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
  float shd = max(max(clamp((hs.g - 0.4) / 5.0, 0.0, 1.0), cloudShadow(P) * 0.6), jetShadow(P));
  float tone = 7.7 - 1.12 * log2(1.0 + d / 0.7) - shd * 1.4;
  tone += dot(g, vec2(0.7, 0.45)) * 11.0 * (1.0 - smoothstep(1.5, 9.0, fp)) * (1.0 - smoothstep(0.35, 0.8, -rd.y));
  vec3 col = pal(R_WATER, clamp(int(dq(tone, b)), 0, N_WATER - 1));
  // sky reflection towards grazing angles
  float cosI = max(dot(-rd, n), 0.0);
  float F = 0.02 + 0.98 * pow(1.0 - cosI, 5.0);
  F *= 1.0 - 0.55 * shd;
  float Fq = clamp(dq(F * 4.0, b2) / 4.0, 0.0, 1.0);
  if (Fq > 0.0) {
    vec3 r = reflect(rd, n);
    r.y = abs(r.y);
    col = mix(col, skyBand(r, b, b3), Fq * 0.9);
  }
  float fl = flashLight(P);
  if (fl > 0.05 && fl > b3) col = pal(R_GLIT, 1);
  // shore foam lapping in bands
  float fn = vnoiseP(Pw / 12.8, vec2(TILE / 12.8));
  float band = fract(d * 1.25 + fn * 0.9 - uTime * 0.3);
  bool foam = d < 0.22 || (d < 1.8 && band < 0.13 + 0.12 * (1.0 - d / 1.8));
  if (foam && fp < 9.0) col = pal(R_FOAM, shd > 0.5 ? 0 : (d < 0.22 ? 2 : 1));
  // wakes, rings, foam patches
  vec4 dc = decal(P);
  if (dc.r > 0.03) {
    float fz = vnoiseP(Pw / 2.56, vec2(TILE / 2.56));
    if (dc.r * (0.55 + 0.9 * fz) > b3 + 0.12) col = pal(R_FOAM, dc.r > 0.6 ? 2 : 1);
  }
  // glitter path + short glints
  if (shd < 0.5) {
    float gcs = fp < 0.45 ? 0.4 : (fp < 0.9 ? 0.8 : 1.6);
    vec2 gc = floor(Pw / gcs);
    vec2 gm = mod(gc, TILE / gcs);
    vec2 gf = fract(Pw / gcs) - 0.5;
    float inDot = step(dot(gf, gf), 0.14);
    float hg = hash12(gm);
    float tt = uTime * (1.3 + hg * 2.2) + hg * 11.0;
    float ph = fract(tt);
    vec2 jn = (hash22(gm + floor(tt)) - 0.5) * 0.24;
    vec3 nf = normalize(n + vec3(jn.x, 0.0, jn.y));
    float sd = dot(reflect(rd, nf), uSun);
    if (fp < 7.0) {
      if (sd > 0.987 && ph < 0.4 && inDot > 0.5) col = pal(R_GLIT, sd > 0.996 ? 2 : (sd > 0.992 ? 1 : 0));
      else if (hg > 0.996 && ph < 0.1 && d > 0.5 && inDot > 0.5) col = pal(R_GLIT, 2);
    } else {
      float sds = dot(reflect(rd, n), uSun);
      if (sds > 0.985 && b3 < smoothstep(0.985, 0.998, sds)) col = pal(R_GLIT, sds > 0.996 ? 1 : 0);
    }
  }
  return col;
}

vec3 cloudColor(vec3 P, vec3 rd, float t, vec2 fc, float b, bool top) {
  vec2 q = (P.xz + uCloudOff) / CCELL;
  vec2 uv = (q + 0.5) / float(NC);
  float e = 1.0 / float(NC);
  vec2 as = textureLod(uCl, uv, 0.0).rg;
  float ax = textureLod(uCl, uv + vec2(e, 0.0), 0.0).r - textureLod(uCl, uv - vec2(e, 0.0), 0.0).r;
  float az = textureLod(uCl, uv + vec2(0.0, e), 0.0).r - textureLod(uCl, uv - vec2(0.0, e), 0.0).r;
  vec3 n = top ? normalize(vec3(-ax, 2.0 * CCELL, -az)) : normalize(vec3(KB * ax, -2.0 * CCELL, KB * az));
  float ndl = dot(n, uSun);
  float l;
  if (top) {
    float self = smoothstep(4.0, 26.0, as.g - as.r);
    float hgt = clamp((P.y - CB) / 360.0, 0.0, 1.0);
    l = 0.24 + 0.62 * (0.5 + 0.5 * ndl);
    l = l * (1.0 - 0.45 * self) + 0.18 * hgt;
  } else {
    l = 0.14 + 0.1 * (1.0 + ndl);
  }
  l *= 1.0 - 0.55 * jetShadow(P);
  l += flashLight(P) * 0.5;
  float sv = dot(rd, uSun);
  float rim = top ? smoothstep(0.8, 0.97, sv) * (1.0 - smoothstep(3.0, 30.0, as.r)) * smoothstep(25.0, 60.0, P.y - CB) : 0.0;
  if (rim > 0.35) return pal(R_CLOUD, rim > 0.7 ? 7 : 6);
  return ramp(R_CLOUD, N_CLOUD - 1, l, b);
}

vec3 skyColor(vec3 rd, vec2 fc, float b) {
  float b2 = bayer(fc + vec2(2.0, 1.0));
  vec3 c = skyBand(rd, b, b2);
  // thin high streaks
  if (rd.y > 0.035 && rd.y < 0.7) {
    float az = atan(rd.x, -rd.z) / 6.2831853 + 0.5;
    float el = asin(rd.y);
    float warp = vnoiseP(vec2(az * 6.0, el * 5.0), vec2(6.0, 1000.0)) - 0.5;
    float band = el * 26.0 + az * 9.0 + warp * 3.0;
    float id = floor(band);
    float seg = vnoiseP(vec2(az * 40.0, id * 7.31), vec2(40.0, 1000.0));

    this.set(n.abG.gain, J.ab ? 0.55 * inside : 0, 0.15);
    const sp = J.v / 300;
    this.set(n.windG.gain, 0.025 * sp * sp + (J.roll >= 0 ? 0.05 : 0));
    this.set(n.sprG.gain, J.overWater && J.agl < 32 ? 0.12 * (1 - J.agl / 32) : 0);
    const warn = J.pullUp && view.cur === VIEW_COCKPIT && (sim.time * 5 % 1) < 0.5;
    this.set(n.beepG.gain, warn ? 0.035 : 0, 0.01);
  },
  burst(opts) {
    const ctx = this.ctx, now = ctx.currentTime + (opts.delay || 0);
    const s = ctx.createBufferSource(); s.buffer = opts.brown ? this.brown : this.white;
    const f = ctx.createBiquadFilter(); f.type = opts.type || 'lowpass'; f.Q.value = opts.q || 0.7;
    f.frequency.setValueAtTime(opts.f0, now); f.frequency.exponentialRampToValueAtTime(opts.f1, now + opts.dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(opts.vol, now + (opts.att || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, now + opts.dur);
    s.connect(f); f.connect(g); g.connect(this.n.master);
    s.start(now, Math.random()); s.stop(now + opts.dur + 0.05);
  },
  tone(type, f0, f1, dur, vol, delay) {
    const ctx = this.ctx, now = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(this.n.master); o.start(now); o.stop(now + dur + 0.05);
  },
  launch() { if (!this.on) return; this.tone('sine', 140, 60, 0.12, 0.25); this.burst({ type: 'bandpass', f0: 2600, f1: 380, dur: 1.4, vol: 0.4, q: 0.9, att: 0.05, delay: 0.2 }); },
  boom(d, water) {
    if (!this.on) return;
    const delay = Math.min(d / 340, 2.5), v = clamp(1.6 / (1 + d / 500), 0.05, 1.2);
    this.burst({ brown: true, f0: 900, f1: 60, dur: 2.2, vol: v, att: 0.01, delay });
    this.tone('sine', 70, 28, 0.9, v * 0.8, delay);
    if (water) this.burst({ type: 'highpass', f0: 2500, f1: 900, dur: 2.4, vol: v * 0.35, att: 0.2, delay: delay + 0.1 });
  },
  roll() { if (!this.on) return; this.burst({ type: 'bandpass', f0: 500, f1: 1400, dur: 0.9, vol: 0.18, q: 1.2, att: 0.3 }); },
  click() { if (!this.on) return; this.tone('square', 900, 700, 0.05, 0.05); },
};

// =====================================================================
//  INTERFACE
// =====================================================================
const UI = {
  touch: false, nameTimer: 0,
  el: { strip: $('strip'), sound: $('sound'), soundLabel: $('sound-label'), title: $('titlecard'), prompt: $('prompt'), name: $('view-name'), pips: Array.from(document.querySelectorAll('#msl i')) },
  viewName(s) { const e = this.el.name; e.textContent = s; e.classList.add('on'); clearTimeout(this.nameTimer); this.nameTimer = setTimeout(() => e.classList.remove('on'), 1300); },
  sound(on) { this.el.soundLabel.textContent = on ? 'SOUND ON' : 'SOUND OFF'; this.el.sound.classList.toggle('live', on); this.el.sound.setAttribute('aria-pressed', on ? 'true' : 'false'); },
  lift: -1,
  update() {
    if (this.touch && OV.L) {
      // keep the touch buttons clear of the instrument panel when they would cover it (portrait phones)
      const dpr = window.devicePixelRatio || 1, ck = cockpitAmount();
      const clusterRight = (OV.L.cx1 * R.s + R.ox) / dpr;
      const lift = clusterRight > window.innerWidth - 215 ? Math.round((OV.L.ph * R.s / dpr + 6) * ck) : 0;
      if (lift !== this.lift) { this.lift = lift; document.body.style.setProperty('--lift', lift + 'px'); }
    }
    rails.forEach((r, i) => {
      const p = this.el.pips[i];
      const f = r.ready ? 1 : 1 - r.t / RELOAD;
      p.firstChild.style.height = Math.round(f * 100) + '%';
      p.classList.toggle('reload', !r.ready);
    });
  },
  setTouch() {
    if (this.touch) return;
    this.touch = true;
    document.body.classList.add('touch');
    this.el.prompt.textContent = 'touch and drag to fly';
  },
};
function makeFavicon() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = '#2a1f36'; x.fillRect(0, 0, 32, 32);
  x.fillStyle = '#ffb070'; x.fillRect(4, 22, 24, 4);
  x.fillStyle = '#ffd7a2';
  for (const [a, b, w, h] of [[15, 4, 2, 20], [14, 8, 4, 12], [8, 14, 16, 3], [5, 16, 22, 2], [11, 21, 10, 2], [12, 6, 1, 0]]) x.fillRect(a, b, w, h);
  x.fillStyle = '#e94947'; x.fillRect(12, 18, 1, 3); x.fillRect(19, 18, 1, 3);
  const l = document.createElement('link'); l.rel = 'icon'; l.href = c.toDataURL(); document.head.appendChild(l);
}
function takeControl() {
  if (!jet.auto) return;
  jet.auto = false;
  UI.el.title.classList.remove('on');
}
function setCursorFromClient(cx, cy) {
  const r = canvas.getBoundingClientRect();
  const k = R.Wd / Math.max(1, r.width);
  const px = (cx - r.left) * k - R.ox, py = (cy - r.top) * k - R.oy;
  input.mx = clamp(px / (R.W * R.s), 0, 1); input.my = clamp(py / (R.H * R.s), 0, 1);
}
function bindInput() {
  window.addEventListener('mousemove', (e) => {
    setCursorFromClient(e.clientX, e.clientY);
    if (!STATE.running) return;
    if (input.lastMoveX !== null) {
      const d = Math.hypot(e.clientX - input.lastMoveX, e.clientY - input.lastMoveY);
      if (d > 0) { input.moveAcc = (input.moveAcc || 0) + d; if (input.moveAcc > 8) takeControl(); }
    }
    input.lastMoveX = e.clientX; input.lastMoveY = e.clientY;
  });
  window.addEventListener('mousedown', (e) => {
    if (!STATE.running || (e.target && e.target.closest && e.target.closest('#sound'))) return;
    if (e.button === 0) { input.lDown = true; input.lTime = performance.now(); input.boostMouse = false; }
    else if (e.button === 2) { fireMissile(); }
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button === 0 && input.lDown) {
      input.lDown = false;
      if (!input.boostMouse && performance.now() - input.lTime < 230) { startRoll(); takeControl(); }
      input.boostMouse = false;
    }
  });
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (!STATE.running) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) cycleView(); }
    else if (e.code === 'KeyF') { if (!e.repeat) fireMissile(); }
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.boostKey = true;
    else if (e.code === 'KeyR') { if (!e.repeat) startRoll(); }
    else if (e.code === 'KeyM') { if (!e.repeat) AUDIO.toggle(); }
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.boostKey = false; });
  window.addEventListener('blur', () => { input.lDown = false; input.boostMouse = false; input.boostKey = false; input.boostTouch = false; });
  window.addEventListener('wheel', (e) => { if (view.cur === VIEW_TOP) jet.topAlt = clamp(jet.topAlt - e.deltaY * 1.2, 40, 6000); }, { passive: true });
  UI.el.sound.addEventListener('click', (e) => { e.stopPropagation(); AUDIO.toggle(); UI.el.sound.blur(); });
  // touch: drag anywhere to steer, buttons for the rest
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch' || !STATE.running) return;
    e.preventDefault();
    UI.setTouch();
    if (input.touchSteer === null) { input.touchSteer = e.pointerId; input.steerRelease = false; setCursorFromClient(e.clientX, e.clientY); takeControl(); }
  });
  canvas.addEventListener('pointermove', (e) => { if (e.pointerId === input.touchSteer) setCursorFromClient(e.clientX, e.clientY); });
  const endSteer = (e) => { if (e.pointerId === input.touchSteer) { input.touchSteer = null; input.steerRelease = true; } };
  canvas.addEventListener('pointerup', endSteer); canvas.addEventListener('pointercancel', endSteer);
  const btn = (id, down, up) => {
    const el = $(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); UI.setTouch(); el.classList.add('down'); if (STATE.running) { takeControl(); down(); } });
    const rel = (e) => { el.classList.remove('down'); if (up) up(); };
    el.addEventListener('pointerup', rel); el.addEventListener('pointercancel', rel); el.addEventListener('pointerleave', rel);
  };
  btn('t-fire', () => fireMissile());
  btn('t-roll', () => startRoll());
  btn('t-view', () => cycleView());
  btn('t-boost', () => { input.boostTouch = true; }, () => { input.boostTouch = false; });
  window.addEventListener('touchstart', () => UI.setTouch(), { passive: true });
  window.addEventListener('resize', () => { if (STATE.running) applySize(); });
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
const STATE = { running: false, last: 0, paused: false, attractT: 0 };
// ?attract: silent autopilot with no UI or input, for use as a live website background.
// The parent page can post {dusk:'pause'} / {dusk:'resume'}; the game posts {dusk:'ready'} once flying.
const ATTRACT = new URLSearchParams(location.search).has('attract');
window.addEventListener('message', (e) => {
  const m = e.data && e.data.dusk;
  if (m === 'pause') STATE.paused = true;
  else if (m === 'resume') { STATE.paused = false; STATE.last = performance.now(); }
});
function step(dt) {
  if (sim.frozen) return;
  sim.time += dt;
  if (ATTRACT && jet.auto) { STATE.attractT += dt; if (STATE.attractT > 12) { STATE.attractT = 0; startRoll(); } }
  if (sim.fade > 0) sim.fade = Math.max(0, sim.fade - dt * 0.8);
  if (input.lDown && !input.boostMouse && performance.now() - input.lTime > 230) { input.boostMouse = true; takeControl(); }
  if (input.steerRelease && view.cur !== VIEW_TOP) {
    const k = Math.min(1, dt * 3);
    input.mx += (0.5 - input.mx) * k; input.my += (0.5 - input.my) * k;
  }
  const n = Math.max(1, Math.ceil(dt / (1 / 90)));
  const h = dt / n;
  for (let i = 0; i < n; i++) updateJet(h);
  updateMissiles(dt);
  updateSpray(dt);
  updateParticles(dt);
  updateDecals();
  updateTrails();
  if (FX.flash) { FX.flash.t += dt; if (FX.flash.t > FX.flash.life) FX.flash = null; }
  sim.screenFlash *= Math.exp(-dt * 9);
  if (sim.screenFlash < 0.01) sim.screenFlash = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (DUSK.slowMs) { const t = performance.now(); while (performance.now() - t < DUSK.slowMs) { /* test hook: simulate a slow GPU */ } }
  if (DUSK.manual || STATE.paused) { STATE.last = now; return; } // test hook / embedder pause
  let dt = (now - STATE.last) / 1000;
  STATE.last = now;
  if (!STATE.running) return;
  if (!(dt > 0)) dt = 1 / 60;
  const real = dt;
  dt = Math.min(dt, 0.1);
  try {
    step(dt);
    updateCamera(dt);
    AUDIO.update();
    UI.update();
    drawOverlay(dt);
    renderFrame();
  } catch (err) {
    DUSK.errors.push(String(err && err.stack || err));
    if (DUSK.errors.length < 4) console.error(err);
  }
  perfTrack(real);
}

// =====================================================================
//  LOADING: terrain + clouds generated by web workers, shaders compiled meanwhile
// =====================================================================
function setProgress(f, msg) {
  $('bar').firstChild.style.width = Math.round(clamp(f, 0, 1) * 100) + '%';
  if (msg) $('status').textContent = msg;
}
function fail(msg) {
  $('bar').style.display = 'none'; $('status').style.display = 'none';
  const f = $('fail'); f.style.display = 'block'; f.textContent = msg;
}
function generateWorld() {
  return new Promise((resolve, reject) => {
    const src = $('gen-src').textContent;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const nw = clamp((navigator.hardwareConcurrency || 4) - 1, 2, 8);
    const workers = [];
    for (let i = 0; i < nw + 1; i++) workers.push(new Worker(url));
    const az = SUN_AZ, sun = [Math.sin(az), -Math.cos(az), Math.tan(SUN_EL)];
    const H = new Float32Array(N * N), B = new Uint8Array(N * N * 4);
    const CH = 32, jobs = [];
    for (let r = 0; r < N; r += CH) jobs.push([r, Math.min(N, r + CH)]);
    let rowsDone = 0, pending = 0, terrain = null, clouds = null;
    const partial = {};
    const progress = () => {
      const f = rowsDone / N * 0.78 + (terrain ? 0.14 : 0) + (clouds ? 0.04 : 0);
      setProgress(f, terrain ? 'seeding clouds' : rowsDone >= N ? 'filling the lakes' : 'raising the hills');
    };
    const maybeDone = () => {
      if (terrain && clouds) { workers.forEach((w) => w.terminate()); URL.revokeObjectURL(url); resolve({ terrain, clouds }); }
    };
    const feed = (w) => {
      if (!jobs.length) return false;
      const [r0, r1] = jobs.shift();
      pending++;
      w.postMessage({ cmd: 'rows', N, r0, r1, seed: SEED, id: r0 });
      return true;
    };
    const cloudWorker = workers[nw];
    cloudWorker.onmessage = (e) => { if (e.data.cmd === 'clouds') { clouds = e.data; progress(); maybeDone(); } };
    cloudWorker.onerror = (e) => reject(e);
    cloudWorker.postMessage({ cmd: 'clouds', N: NC, cell: CCELL, seed: SEED + 7, sun });
    for (let i = 0; i < nw; i++) {
      const w = workers[i];
      w.onerror = (e) => reject(e);
      w.onmessage = (e) => {
        const m = e.data;
        if (m.cmd === 'progress') {
          partial[m.id] = m.done;
          let s = rowsDone; for (const k in partial) s += partial[k];
          setProgress(s / N * 0.78, 'raising the hills');
        } else if (m.cmd === 'rows') {
          H.set(m.H, m.r0 * N); B.set(m.B, m.r0 * N * 4);
          rowsDone += m.r1 - m.r0; delete partial[m.id]; pending--;
          progress();
          if (!feed(w) && pending === 0) {
            w.onmessage = (ev) => { if (ev.data.cmd === 'finished') { terrain = ev.data; progress(); maybeDone(); } };
            w.postMessage({ cmd: 'finish', N, cell: CELL, H, B, sun }, [H.buffer, B.buffer]);
          }
        }
      };
      feed(w); feed(w);
    }
  });
}
async function boot() {
  try { makeFavicon(); } catch (e) { /* cosmetic */ }
  try { if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) UI.setTouch(); } catch (e) { /* ignore */ }
  if (!gl) { fail('Dusk Patrol needs WebGL2, which this browser or device does not provide. Try a recent Chrome, Edge, Firefox or Safari.'); return; }
  try {
    compileAll();
    initStaticGL();
    const t0 = performance.now();
    const world = await generateWorld();
    DUSK.genMs = performance.now() - t0;
    const tr = world.terrain, cl = world.clouds;
    WD.hc = tr.hc; WD.ground = tr.ground; WD.hs = tr.hs; WD.maxH = tr.maxH;
    WD.cl = cl.as; WD.cmaxA = cl.maxA;
    uploadTerrain(tr); uploadClouds(cl);
    setProgress(0.97, 'warming the engines');
    await new Promise((res) => { const poll = () => { if (allProgramsReady()) res(); else setTimeout(poll, 30); }; poll(); });
    finishAll();
    initDynamicGeo();
    applySize();
    if (ATTRACT) { document.body.classList.add('attract'); sim.fade = 0; } else bindInput();
    updateJet(0.016); updateCamera(0.016);
    for (let i = 0; i < 30; i++) updateTrails();
    setProgress(1, 'ready');
    STATE.running = true;
    STATE.last = performance.now();
    requestAnimationFrame(frame);
    setTimeout(() => {
      $('loader').classList.add('gone');
      if (ATTRACT) { if (window.parent !== window) window.parent.postMessage({ dusk: 'ready' }, '*'); return; }
      if (jet.auto) UI.el.title.classList.add('on');
      UI.el.strip.classList.add('on'); UI.el.sound.classList.add('on');
    }, 250);
    DUSK.ready = true;
  } catch (err) {
    console.error(err);
    DUSK.errors.push(String(err && err.message || err));
    fail('Something went wrong while starting up: ' + (err && err.message ? err.message.split('\n')[0] : err));
  }
}

// =====================================================================
//  TEST HOOKS (used by the headless checks)
// =====================================================================
const DUSK = window.DUSK = {
  ready: false, errors: [], genMs: 0, slowMs: 0, manual: false, hideCursor: false,
  state() {
    const J = jet;
    return { pos: J.pos.slice(), psi: J.psi, gamma: J.gamma, phi: J.phi, v: J.v, g: J.g, agl: J.agl, auto: J.auto, pullUp: J.pullUp, view: view.cur, viewT: view.t,
      particles: PT.n, missiles: missiles.length, decals: DEC.length, railsReady: rails.filter((r) => r.ready).length, fps: PERF.fps, frameMs: PERF.frameMs, level: PERF.level,
      W: R.W, H: R.H, scale: R.s, time: sim.time, floorHits: J.floorHits || 0, overWater: J.overWater, ab: J.ab, rolling: J.roll >= 0 };
  },
  setView(v, instant) { cycleView(v); if (instant) view.t = 1; },
  cursor(x, y) { input.mx = x; input.my = y; },
  take() { takeControl(); },
  fire() { return fireMissile(); },
  roll() { startRoll(); },
  boost(on) { input.boostKey = !!on; },
  teleport(o) { if (o.x !== undefined) { jet.pos = [o.x, o.y, o.z]; } if (o.psi !== undefined) { jet.psi = o.psi; view.chase.psi = o.psi; } if (o.gamma !== undefined) jet.gamma = o.gamma; jet.prevVel = null; trails[0].length = 0; trails[1].length = 0; jet.wakeLast = null; },
  advance(sec, h) { h = h || 1 / 60; const n = Math.round(sec / h); for (let i = 0; i < n; i++) { step(h); updateCamera(h); } },
  freeze(b) { sim.frozen = !!b; },
  setRes(h) { R.targetH = h; applySize(); },
  hc(x, z) { return hcAt(x, z); },
  checkFinite() {
    const J = jet, bad = [];
    for (const k of ['psi', 'gamma', 'phi', 'v', 'g']) if (!Number.isFinite(J[k])) bad.push(k);
    J.pos.forEach((v, i) => { if (!Number.isFinite(v)) bad.push('pos' + i); });
    for (let i = 0; i < PT.n; i++) if (!Number.isFinite(PT.x[i] + PT.y[i] + PT.z[i])) { bad.push('particle'); break; }
    return bad;
  },
  glError() { return gl.getError(); },
  lastImpact() { return FX.last || null; },
  missiles() { return missiles.map((m) => ({ pos: m.pos.slice(), tgt: m.tgt.slice() })); },
  render() { drawOverlay(1 / 60); renderFrame(); },
  benchMed(n, worldOnly) {
    const px = new Uint8Array(4), ts = [];
    const run = () => { if (worldOnly) { gl.bindFramebuffer(gl.FRAMEBUFFER, FB.scene); gl.useProgram(PROGS.world.p); gl.bindVertexArray(GEO.full); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.ALWAYS); gl.drawArrays(gl.TRIANGLES, 0, 3); } else renderFrame(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
    renderFrame(); for (let i = 0; i < 20; i++) run();
    for (let i = 0; i < n; i++) { const t0 = performance.now(); run(); ts.push(performance.now() - t0); }
    ts.sort((a, b) => a - b);
    return +ts[Math.floor(n / 2)].toFixed(3);
  },
};
window.addEventListener('error', (e) => DUSK.errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => DUSK.errors.push(String(e.reason)));
boot();
})();
</script>
